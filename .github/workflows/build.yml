name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'V*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Xposed flavor to build'
        required: true
        default: 'both'
        type: choice
        options:
          - api100
          - api101
          - both
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.compute.outputs.include }}
    steps:
      - id: compute
        shell: pwsh
        run: |
          $event   = '${{ github.event_name }}'
          $ref     = '${{ github.ref }}'
          $inFlav  = '${{ github.event.inputs.flavor }}'
          $inType  = '${{ github.event.inputs.build_type }}'
          $isTag   = $ref.StartsWith('refs/tags/V')

          switch ($event) {
            'workflow_dispatch' {
              $flavors = if ($inFlav -eq 'both') { @('api100','api101') } else { @($inFlav) }
              $types   = if ($inType -eq 'both') { @('debug','release') } else { @($inType) }
            }
            'pull_request' {
              $flavors = @('api100','api101')
              $types   = @('debug')
            }
            'push' {
              # Release for every push, not just tags: the desktop-side tools install
              # these artifacts directly, and a debug APK is signed with a keystore the
              # runner generates from scratch each run, so every new debug build would
              # need an uninstall (wiping app data) before it could be installed.
              # Use workflow_dispatch if a debug build is needed.
              $flavors = @('api100','api101')
              $types   = @('release')
            }
            default {
              $flavors = @('api100')
              $types   = @('debug')
            }
          }

          $include = @()
          foreach ($f in $flavors) {
            foreach ($t in $types) {
              $include += [ordered]@{ flavor = $f; build_type = $t }
            }
          }
          $json = ConvertTo-Json -Compress -Depth 4 -InputObject @($include)
          "include=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved matrix: $json"

  build:
    name: Build ${{ matrix.flavor }} ${{ matrix.build_type }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Aliyun maven mirrors (CI workspace only)
        shell: pwsh
        run: |
          $files = @(
            'android/build.gradle.kts',
            'android/settings.gradle.kts'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { continue }
            $content = Get-Content -Raw -Path $file
            $cleaned = [regex]::Replace(
              $content,
              '(?ms)\s*maven\s*\{\s*url\s*=\s*uri\(\s*"https://maven\.aliyun\.com/[^"]*"\s*\)\s*\}',
              ''
            )
            Set-Content -Path $file -Value $cleaned -NoNewline -Encoding UTF8
            Write-Host "Stripped aliyun mirrors from $file"
          }
          $remaining = Select-String -Path $files -Pattern 'aliyun' -SimpleMatch
          if ($remaining) {
            Write-Error "Aliyun references still present after strip:"
            $remaining | ForEach-Object { Write-Error "  $($_.Path):$($_.LineNumber)  $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "OK - no aliyun references remain."

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        shell: pwsh
        run: flutter pub get

      - name: Pigeon codegen (one-shot)
        shell: pwsh
        run: ./.buildScript/pigen_watch.ps1 -Once

      - name: Set up release signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # android/app/build.gradle.kts reads android/key.properties and only then
          # creates the "release" signing config, so both files have to exist before
          # Gradle configures. Neither file is committed - the keystore arrives as a
          # base64 secret and is written fresh into every runner.
          $keystorePath = 'android/jsxposedx-release.jks'
          $propertiesPath = 'android/key.properties'

          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host 'ANDROID_KEYSTORE_BASE64 is not set.'
            Write-Host 'Release APKs will come out UNSIGNED (app-<flavor>-release-unsigned.apk) and cannot be installed.'
            exit 0
          }

          foreach ($name in @('KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "Secret $name is missing. All four signing secrets must be set."
              exit 1
            }
          }

          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

          # storeFile is resolved with rootProject.file(), and the Gradle root here is
          # android/, so a bare filename points at android/jsxposedx-release.jks.
          # Java reads .properties as ISO-8859-1: keep the passwords ASCII.
          @(
            'storeFile=jsxposedx-release.jks'
            "storePassword=$env:KEYSTORE_PASSWORD"
            "keyAlias=$env:KEY_ALIAS"
            "keyPassword=$env:KEY_PASSWORD"
          ) | Set-Content -Path $propertiesPath -Encoding utf8

          Write-Host "Wrote $propertiesPath and $keystorePath"

      - name: Build APK (${{ matrix.flavor }} / ${{ matrix.build_type }})
        shell: pwsh
        run: flutter build apk --flavor ${{ matrix.flavor }} --${{ matrix.build_type }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.flavor }}-${{ matrix.build_type }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-${{ matrix.build_type }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Stop Gradle daemon (release cache locks before post-job save)
        if: always()
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            (cd android && bash ./gradlew --stop) || true
          fi
